name: RPM

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'rpm/**'
      - '.github/workflows/rpm.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'rpm/**'
      - '.github/workflows/rpm.yml'
  workflow_dispatch:

jobs:
  fedora-rpm:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install git
        run: dnf -y -q install git
      - uses: actions/checkout@v7
      - name: Build the RPMs
        # 1000 and up, above the release numbers of local builds, and higher with every run so that dnf sees an upgrade
        run: SCANNER_RELEASE=$((1000 + GITHUB_RUN_NUMBER)) rpm/build-ci.sh
      - uses: actions/upload-artifact@v7
        with:
          name: scanner-portal-fedora-44-rpms
          path: rpm/out/
