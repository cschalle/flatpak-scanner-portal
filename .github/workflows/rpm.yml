name: RPM

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'rpm/**'
      - '.github/workflows/rpm.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'rpm/**'
      - '.github/workflows/rpm.yml'
  workflow_dispatch:

jobs:
  fedora-rpm:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install git
        run: dnf -y -q install git
      - uses: actions/checkout@v7
      - name: Build the RPMs
        # 1000 and up, above the release numbers of local builds, and higher with every run so that dnf sees an upgrade
        run: SCANNER_RELEASE=$((1000 + GITHUB_RUN_NUMBER)) rpm/build-ci.sh
      - uses: actions/upload-artifact@v7
        with:
          name: scanner-portal-fedora-44-rpms
          path: rpm/out/

  # The RPMs of the latest build on main, at a link that needs no login
  publish:
    needs: fedora-rpm
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: scanner-portal-fedora-44-rpms
          path: rpms
      - name: Replace the rpms-latest pre-release
        run: |
          gh release delete rpms-latest --cleanup-tag --yes || true
          gh release create rpms-latest --prerelease --target "$GITHUB_SHA" \
            --title "Fedora 44 RPMs of the latest build" \
            --notes "Built by CI from $GITHUB_SHA. Not signed; for testing the scanner portal." \
            rpms/*.x86_64.rpm

  # Mirror the same RPMs into this repo's GitHub Packages, as a generic OCI artifact (GitHub
  # Packages has no RPM/yum repository type, so there's no "real" package type to push to)
  packages:
    needs: fedora-rpm
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: scanner-portal-fedora-44-rpms
          path: rpms
      - uses: oras-project/setup-oras@v1
      - name: Push the RPMs to ghcr.io
        run: |
          echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "ghcr.io/${{ github.repository }}:latest,${{ github.run_number }}" \
            --artifact-type application/vnd.fedoraproject.rpm \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.description=Fedora 44 RPMs of xdg-desktop-portal, xdg-desktop-portal-gnome and xdg-desktop-portal-gtk with the scanner portal patches. Not signed; for testing the scanner portal." \
            rpms/*.x86_64.rpm
